<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Wes Huber: Software Engineer, Founder, Open-source contributor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1220"/>
      <stop offset="1" stop-color="#1a1b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7aa2f7"/>
      <stop offset="0.5" stop-color="#bb9af7"/>
      <stop offset="1" stop-color="#f7768e"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <circle cx="1040" cy="40" r="240" fill="#7aa2f7" fill-opacity="0.07"/>
    <circle cx="120" cy="320" r="200" fill="#f7768e" fill-opacity="0.06"/>
  </g>

  <!-- name and tagline -->
  <text x="72" y="138" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="74" font-weight="800" fill="#e6e9f2" letter-spacing="-1.5">Wes Huber</text>
  <rect x="75" y="156" width="240" height="6" rx="3" fill="url(#accent)">
    <animate attributeName="width" values="240;300;240" dur="4s" repeatCount="indefinite"/>
  </rect>
  <text x="72" y="206" font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" font-size="25" fill="#c0caf5">Software Engineer  ·  Founder  ·  Open-source contributor</text>
  <text x="72" y="244" font-family="Consolas, Menlo, Monaco, monospace" font-size="17" fill="#7aa2f7">Long Beach, CA   //   weshuber.com   //   @wbaxterh</text>

  <!-- skateboard, side view -->
  <g transform="translate(870 165) rotate(-14)">
    <animateTransform attributeName="transform" type="translate" values="0 0; 0 -8; 0 0" dur="3s" repeatCount="indefinite" additive="sum"/>
    <path d="M-128 -24 Q-108 -2 -82 -2 L82 -2 Q108 -2 128 -24" fill="none" stroke="#7aa2f7" stroke-width="11" stroke-linecap="round"/>
    <path d="M-72 -2 V14 M72 -2 V14" stroke="#c0caf5" stroke-width="6" stroke-linecap="round"/>
    <circle cx="-72" cy="24" r="12" fill="#1a1b2e" stroke="#f7768e" stroke-width="5"/>
    <circle cx="72" cy="24" r="12" fill="#1a1b2e" stroke="#f7768e" stroke-width="5"/>
  </g>

  <!-- robot -->
  <g transform="translate(1080 150)">
    <line x1="0" y1="-46" x2="0" y2="-70" stroke="#c0caf5" stroke-width="5" stroke-linecap="round"/>
    <circle cx="0" cy="-76" r="7" fill="#f7768e">
      <animate attributeName="fill-opacity" values="1;0.3;1" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <rect x="-46" y="-46" width="92" height="78" rx="16" fill="#1a1b2e" stroke="#bb9af7" stroke-width="5"/>
    <rect x="-60" y="-16" width="12" height="26" rx="4" fill="#bb9af7"/>
    <rect x="48" y="-16" width="12" height="26" rx="4" fill="#bb9af7"/>
    <rect x="-28" y="-22" width="20" height="16" rx="5" fill="#7aa2f7">
      <animate attributeName="height" values="16;2;16" keyTimes="0;0.5;1" dur="4s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <rect x="8" y="-22" width="20" height="16" rx="5" fill="#7aa2f7">
      <animate attributeName="height" values="16;2;16" keyTimes="0;0.5;1" dur="4s" begin="1s" repeatCount="indefinite"/>
    </rect>
    <path d="M-18 12 H18" stroke="#c0caf5" stroke-width="5" stroke-linecap="round"/>
    <path d="M-12 12 V18 M0 12 V18 M12 12 V18" stroke="#c0caf5" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
